<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tradexalprox — Login &amp; Register</title>
  <meta name="description" content="Tradexalprox — Access your trading dashboard and manage your account.">
  <meta name="keywords" content="Tradexalprox, copy trading, trading, account">
  <meta name="author" content="Tradexalprox">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #authOverlay {
      background: rgba(255,255,255,.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(83,100,241,.25);
      border-top-color: #5364f1;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen bg-[#0a0e1a] flex items-center justify-center p-4 sm:p-6">
  <div id="authOverlay" class="fixed inset-0 z-[100] hidden items-center justify-center"><div class="spinner"></div></div>

  <div id="loginCard" class="w-full max-w-md bg-[#535a94]/95 rounded-[2.5rem] shadow-2xl border border-white/10 overflow-hidden backdrop-blur-md">
    <div class="p-10 pb-6 text-center">
      <div class="mx-auto h-16 md:h-20 w-16 md:w-20 rounded-2xl bg-gradient-to-br from-blue-300 to-indigo-700 text-white grid place-items-center text-3xl font-black">T</div>
      <p class="text-sm text-white/60 mt-3 font-bold tracking-wide">Tradexalprox</p>
      <p class="text-sm text-white/50 mt-2 font-medium">Access your investment dashboard</p>
    </div>

    <form id="loginForm" class="px-10 pb-10 space-y-4">
      <div class="space-y-1">
        <label class="text-[10px] font-black text-white/50 uppercase tracking-widest ml-1">Email</label>
        <input id="loginEmail" type="email" required placeholder="name@email.com" autocomplete="email" class="w-full px-5 py-3.5 bg-black/20 border border-white/5 rounded-2xl focus:ring-2 focus:ring-[#5364f1]/40 outline-none text-white font-bold placeholder:text-white/20">
      </div>

      <div class="space-y-1">
        <div class="flex justify-between items-center">
          <label class="text-[10px] font-black text-white/50 uppercase tracking-widest ml-1">Password</label>
          <a href="forgot.html" class="text-[10px] font-black text-[#c7d2fe] uppercase hover:text-white transition-colors">Forgot?</a>
        </div>
        <input id="loginPassword" type="password" required placeholder="••••••••" autocomplete="current-password" class="w-full px-5 py-3.5 bg-black/20 border border-white/5 rounded-2xl focus:ring-2 focus:ring-[#5364f1]/40 outline-none text-white font-bold placeholder:text-white/20">
      </div>

      <p id="loginError" class="text-xs text-red-300 text-center hidden"></p>
      <button type="submit" class="w-full py-4 bg-[#5364f1] text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl shadow-black/20 hover:bg-[#4352d1] active:scale-[0.98] transition-all mt-2">Sign In</button>

      <div class="mt-8 pt-6 border-t border-white/5 text-center">
        <p class="text-xs font-medium text-white/50">Don't have an account? <button type="button" id="showRegister" class="text-[#c7d2fe] font-bold hover:text-white transition-colors">Register</button></p>
      </div>
    </form>
  </div>

  <div id="registerCard" class="hidden w-full max-w-[380px] bg-[#3d3f6b] rounded-[2rem] shadow-2xl border border-white/5 overflow-hidden">
    <div class="pt-8 pb-4 px-6 text-center">
      <div class="inline-flex items-center bg-white rounded-lg overflow-hidden shadow-sm">
        <div class="w-12 h-12 bg-[#c4b5fd] flex items-center justify-center text-white text-2xl font-black">T</div>
        <div class="px-4 py-2">
          <span class="font-bold text-[#2f2d52] text-lg">Tradexalprox</span>
        </div>
      </div>
      <p class="text-sm text-white/60 mt-3">Start your trading journey</p>
    </div>

    <form id="registerForm" class="px-6 pb-8 space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[10px] font-bold text-white/60 uppercase tracking-wider mb-1.5 block">First Name</label>
          <input id="firstName" type="text" required autocomplete="given-name" class="w-full px-4 py-3 bg-[#4a4c7a] border border-white/5 rounded-xl text-white text-sm outline-none focus:border-[#5364f1]/50">
        </div>
        <div>
          <label class="text-[10px] font-bold text-white/60 uppercase tracking-wider mb-1.5 block">Last Name</label>
          <input id="lastName" type="text" required autocomplete="family-name" class="w-full px-4 py-3 bg-[#4a4c7a] border border-white/5 rounded-xl text-white text-sm outline-none focus:border-[#5364f1]/50">
        </div>
      </div>

      <div>
        <label class="text-[10px] font-bold text-white/60 uppercase tracking-wider mb-1.5 block">Email Address</label>
        <input id="regEmail" type="email" required placeholder="name@company.com" autocomplete="email" class="w-full px-4 py-3 bg-[#4a4c7a] border border-white/5 rounded-xl text-white text-sm outline-none focus:border-[#5364f1]/50">
      </div>

      <div>
        <label class="text-[10px] font-bold text-white/60 uppercase tracking-wider mb-1.5 block">Phone Number</label>
        <div class="flex gap-2">
          <select id="countryCode" class="px-3 py-3 bg-[#4a4c7a] border border-white/5 rounded-xl text-white text-sm outline-none focus:border-[#5364f1]/50">
            <option value="+1">US (+1)</option>
            <option value="+44">UK (+44)</option>
            <option value="+86">CN (+86)</option>
            <option value="+234">NG (+234)</option>
          </select>
          <input id="phone" type="tel" required placeholder="Phone number" autocomplete="tel-national" class="flex-1 min-w-0 px-4 py-3 bg-[#4a4c7a] border border-white/5 rounded-xl text-white text-sm outline-none focus:border-[#5364f1]/50">
        </div>
      </div>

      <div>
        <label class="text-[10px] font-bold text-white/60 uppercase tracking-wider mb-1.5 block">Set Password</label>
        <input id="regPassword" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" class="w-full px-4 py-3 bg-[#4a4c7a] border border-white/5 rounded-xl text-white text-sm outline-none focus:border-[#5364f1]/50">
      </div>

      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="text-[10px] font-bold text-white/60 uppercase tracking-wider">Referral Code</label>
          <span class="text-[9px] font-semibold text-white/40 uppercase">Optional</span>
        </div>
        <input id="referral" type="text" placeholder="Paste referral UID" class="w-full px-4 py-3 bg-[#4a4c7a] border border-white/5 rounded-xl text-white text-sm outline-none focus:border-[#5364f1]/50 placeholder:text-white/30 uppercase">
      </div>

      <p id="regError" class="text-xs text-red-300 text-center hidden"></p>
      <button type="submit" class="w-full py-3.5 bg-[#5b5fcf] hover:bg-[#4a4ec0] text-white rounded-xl font-bold text-sm tracking-wide active:scale-[0.98] transition-all mt-2">Create Account</button>

      <div class="text-center pt-2">
        <p class="text-xs text-white/50">Already have an account? <button type="button" id="showLogin" class="text-[#c7d2fe] font-semibold hover:text-white transition-colors">Sign In</button></p>
      </div>
    </form>
  </div>

  <script>
    const overlay = document.getElementById('authOverlay');
    const loginCard = document.getElementById('loginCard');
    const registerCard = document.getElementById('registerCard');

    function showOverlay() {
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    document.getElementById('showRegister').addEventListener('click', () => {
      loginCard.classList.add('hidden');
      registerCard.classList.remove('hidden');
    });

    document.getElementById('showLogin').addEventListener('click', () => {
      registerCard.classList.add('hidden');
      loginCard.classList.remove('hidden');
    });

    document.getElementById('loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const error = document.getElementById('loginError');
      error.classList.add('hidden');
      showOverlay();
      setTimeout(() => {
        hideOverlay();
        alert('Login demo complete.');
      }, 600);
    });

    document.getElementById('registerForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const error = document.getElementById('regError');
      error.classList.add('hidden');
      showOverlay();
      setTimeout(() => {
        hideOverlay();
        alert('Registration demo complete.');
      }, 600);
    });
  </script>
</body>
</html>
