<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="keywords" content="Tradexxalpro, copy trading, crypto trading, forex, commodities, invest, Tradexal Pro">

  <link rel="canonical" href="https://login.tradexxalpro.com/">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tradexxalpro">
  <meta property="og:title" content="Tradexxalpro.com – Login & Register">
  <meta property="og:description" content="Copy top traders instantly. Mirror expert trades across crypto, stocks, and commodities automatically.">
  <meta property="og:url" content="https://login.tradexxalpro.com/">

  <meta name="twitter:card" content="summary_large_image">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { 
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; 
      -webkit-font-smoothing: antialiased;
    }
    
    /* Glassmorphic overlay */
    #authOverlay {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(83, 100, 241, 0.25);
      border-top-color: #5364f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="min-h-screen bg-[#0a0e1a] flex items-center justify-center p-4 sm:p-6">

  <!-- Auth Overlay (glassmorphic) -->
  <div id="authOverlay" class="fixed inset-0 z-[100] hidden flex items-center justify-center">
    <div class="spinner"></div>
  </div>

  <!-- ====================== LOGIN CARD ====================== -->
  <div id="loginCard" class="w-full max-w-md bg-[#535a94]/95 rounded-[2.5rem] shadow-2xl border border-white/10 overflow-hidden backdrop-blur-md">
    
    <div class="p-10 pb-6 text-center">
      <img 
        src="https://login.tradexxalpro.com/logo.png" 
        alt="Tradexal Pro" 
        class="h-16 md:h-20 mx-auto brightness-200"
        onerror="this.style.display='none'"
      >
      <p class="text-sm text-white/50 mt-2 font-medium">
        Access your investment dashboard
      </p>
    </div>

    <form id="loginForm" class="px-10 pb-10">
      <div class="space-y-4">
        <div class="space-y-1">
          <label class="text-[10px] font-black text-white/40 uppercase tracking-widest ml-1">Email</label>
          <input id="loginEmail" type="email" required placeholder="name@email.com"
            class="w-full px-5 py-3.5 bg-black/20 border border-white/5 rounded-2xl focus:ring-2 focus:ring-[#5364f1]/40 outline-none transition-all font-bold text-white placeholder:text-white/20">
        </div>

        <div class="space-y-1">
          <div class="flex justify-between items-center">
            <label class="text-[10px] font-black text-white/40 uppercase tracking-widest ml-1">Password</label>
            <a href="forgot.html" class="text-[10px] font-black text-[#5364f1] uppercase hover:text-white transition-colors">Forgot?</a>
          </div>
          <input id="loginPassword" type="password" required placeholder="••••••••"
            class="w-full px-5 py-3.5 bg-black/20 border border-white/5 rounded-2xl focus:ring-2 focus:ring-[#5364f1]/40 outline-none transition-all font-bold text-white placeholder:text-white/20">
        </div>

        <p id="loginError" class="text-xs text-red-400 text-center hidden"></p>

        <button type="submit"
          class="w-full py-4 bg-[#5364f1] text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl shadow-black/20 hover:bg-[#4352d1] active:scale-[0.98] transition-all mt-2">
          Sign In
        </button>
      </div>

      <div class="mt-8 pt-6 border-t border-white/5 text-center">
        <p class="text-xs font-medium text-white/40">
          Don't have an account? 
          <button type="button" id="showRegister" class="text-[#5364f1] font-bold hover:text-white transition-colors">Register</button>
        </p>
      </div>
    </form>
  </div>

  <!-- ====================== REGISTER CARD ====================== -->
  <div id="registerCard" class="hidden w-full max-w-[380px] bg-[#3d3f6b] rounded-[2rem] shadow-2xl border border-white/5 overflow-hidden">
    
    <!-- Logo -->
    <div class="pt-8 pb-4 px-6 text-center">
      <div class="inline-flex items-center bg-white rounded-lg overflow-hidden shadow-sm">
        <div class="w-12 h-12 bg-[#c4b5fd] flex items-center justify-center">
          <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6l-8-4zm0 2.18l6 3v5.82c0 3.9-2.5 7.5-6 8.55-3.5-1.05-6-4.65-6-8.55V7.18l6-3z"/>
            <path d="M11 10h2v6h-2zm0-4h2v2h-2z"/>
          </svg>
        </div>
        <div class="px-4 py-2">
          <span class="font-bold text-gray-900 text-lg tracking-tight">Tradexal Pro</span>
        </div>
      </div>
      <p class="text-sm text-white/50 mt-3">Start your wealth journey</p>
    </div>

    <form id="registerForm" class="px-6 pb-8 space-y-4">
      
      <!-- First + Last Name -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[10px] font-bold text-white/50 uppercase tracking-wider mb-1.5 block">First Name</label>
          <input id="firstName" type="text" required
            class="w-full px-4 py-3 bg-[#4a4c7a] border border-white/5 rounded-xl text-white text-sm outline-none focus:border-[#5364f1]/50 transition placeholder:text-white/20">
        </div>
        <div>
          <label class="text-[10px] font-bold text-white/50 uppercase tracking-wider mb-1.5 block">Last Name</label>
          <input id="lastName" type="text" required
            class="w-full px-4 py-3 bg-[#4a4c7a] border border-white/5 rounded-xl text-white text-sm outline-none focus:border-[#5364f1]/50 transition placeholder:text-white/20">
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="text-[10px] font-bold text-white/50 uppercase tracking-wider mb-1.5 block">Email Address</label>
        <input id="regEmail" type="email" required placeholder="name@company.com"
          class="w-full px-4 py-3 bg-[#4a4c7a] border border-white/5 rounded-xl text-white text-sm outline-none focus:border-[#5364f1]/50 transition placeholder:text-white/30">
      </div>

      <!-- Phone -->
      <div>
        <label class="text-[10px] font-bold text-white/50 uppercase tracking-wider mb-1.5 block">Phone Number</label>
        <div class="flex gap-2">
          <div class="relative">
            <select id="countryCode" class="appearance-none bg-[#4a4c7a] border border-white/5 rounded-xl text-white text-sm px-3 py-3 pr-8 outline-none focus:border-[#5364f1]/50">
              <option value="+1">US (+1)</option>
              <option value="+44">UK (+44)</option>
              <option value="+86">CN (+86)</option>
            </select>
            <svg class="w-4 h-4 absolute right-2 top-1/2 -translate-y-1/2 text-white/40 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </div>
          <input id="phone" type="tel" required placeholder="4432765555"
            class="flex-1 px-4 py-3 bg-[#4a4c7a] border border-white/5 rounded-xl text-white text-sm outline-none focus:border-[#5364f1]/50 transition placeholder:text-white/30">
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="text-[10px] font-bold text-white/50 uppercase tracking-wider mb-1.5 block">Set Password</label>
        <input id="regPassword" type="password" required placeholder="••••••••"
          class="w-full px-4 py-3 bg-[#4a4c7a] border border-white/5 rounded-xl text-white text-sm outline-none focus:border-[#5364f1]/50 transition placeholder:text-white/30">
      </div>

      <!-- Referral -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="text-[10px] font-bold text-white/50 uppercase tracking-wider">Referral Code</label>
          <span class="text-[9px] font-semibold text-white/30 uppercase">Optional</span>
        </div>
        <input id="referral" type="text" placeholder="Paste referrer UID"
          class="w-full px-4 py-3 bg-[#4a4c7a] border border-white/5 rounded-xl text-white text-sm outline-none focus:border-[#5364f1]/50 transition placeholder:text-white/25 uppercase">
      </div>

      <p id="regError" class="text-xs text-red-400 text-center hidden"></p>

      <button type="submit"
        class="w-full py-3.5 bg-[#5b5fcf] hover:bg-[#4a4ec0] text-white rounded-xl font-bold text-sm tracking-wide active:scale-[0.98] transition-all mt-2">
        CREATE ACCOUNT
      </button>

      <div class="text-center pt-2">
        <p class="text-xs text-white/40">
          Already have an account? 
          <button type="button" id="showLogin" class="text-[#a5b4fc] font-semibold hover:text-white transition-colors">Sign In</button>
        </p>
      </div>
    </form>
  </div>

  <script type="module">
    import { auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, updateProfile, ref, set, get, update, increment } from './js/firebase.js';

    // Already logged in?
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'home.html';
      }
    });

    const overlay = document.getElementById('authOverlay');
    const loginCard = document.getElementById('loginCard');
    const registerCard = document.getElementById('registerCard');

    function showOverlay() {
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }
    function hideOverlay() {
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    // Toggle forms
    document.getElementById('showRegister').addEventListener('click', () => {
      loginCard.classList.add('hidden');
      registerCard.classList.remove('hidden');
    });
    document.getElementById('showLogin').addEventListener('click', () => {
      registerCard.classList.add('hidden');
      loginCard.classList.remove('hidden');
    });

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      showOverlay();

      try {
        await signInWithEmailAndPassword(auth, 
          document.getElementById('loginEmail').value.trim(), 
          document.getElementById('loginPassword').value
        );
      } catch (err) {
        hideOverlay();
        errEl.textContent = err.message.replace('Firebase: ', '').replace(/\(auth\/.*\)/, '').trim() || 'Login failed';
        errEl.classList.remove('hidden');
      }
    });

    // Register
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('regError');
      errEl.classList.add('hidden');
      showOverlay();

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const phone = (document.getElementById('countryCode').value + document.getElementById('phone').value.trim());
      const referralCode = document.getElementById('referral').value.trim();

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        const user = cred.user;
        const displayName = (firstName + ' ' + lastName).trim();

        await updateProfile(user, { displayName });

        // Create user profile in RTDB (referralId = their own uid)
        await set(ref(db, 'users/' + user.uid), {
          uid: user.uid,
          email: email,
          firstName: firstName,
          lastName: lastName,
          displayName: displayName,
          phone: phone,
          referralId: user.uid,
          referredBy: referralCode || null,
          balance: 0,
          rewards: 0,
          successfulInvites: 0,
          pendingRewards: 0,
          createdAt: Date.now()
        });

        // If referral code provided, credit the referrer $20
        if (referralCode) {
          try {
            const referrerSnap = await get(ref(db, 'users/' + referralCode));
            if (referrerSnap.exists()) {
              await update(ref(db, 'users/' + referralCode), {
                rewards: increment(20),
                successfulInvites: increment(1),
                pendingRewards: increment(20)
              });
              // Record the referral event
              await set(ref(db, 'referrals/' + referralCode + '/' + user.uid), {
                referredUid: user.uid,
                amount: 20,
                at: Date.now()
              });
            }
          } catch (refErr) {
            console.warn('Referral credit failed', refErr);
          }
        }

        // onAuthStateChanged will redirect
      } catch (err) {
        hideOverlay();
        errEl.textContent = err.message.replace('Firebase: ', '').replace(/\(auth\/.*\)/, '').trim() || 'Registration failed';
        errEl.classList.remove('hidden');
      }
    });
  </script>
